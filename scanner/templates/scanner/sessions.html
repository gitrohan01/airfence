<!DOCTYPE html>
<html>
<head>
    <title>Simulation Sessions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">📂 Simulation Sessions</h2>

    <div class="text-center mb-3">
        <a href="/simulation/" class="btn btn-light">⬅ Back</a>
    </div>

    <table class="table table-dark table-striped text-center">
        <thead>
            <tr>
                <th>Session Name</th>
                <th>Status</th>
                <th>Started</th>
                <th>Ended</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for s in sessions %}
            <tr>
                <td>{{ s.name }}</td>

                <td>
                    {% if s.status == "active" %}
                        <span class="badge bg-success">Active</span>
                    {% else %}
                        <span class="badge bg-secondary">Stopped</span>
                    {% endif %}
                </td>

                <td>{{ s.started_at }}</td>
                <td>{{ s.ended_at }}</td>

                <td>
                    <a href="/simulation/session/{{ s.id }}/" class="btn btn-primary">
                        View Devices
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No sessions found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
