<!DOCTYPE html>
<html>
<head>
    <title>Evil Twin Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">🚨 Evil Twin Detection</h2>

    <div class="text-center mb-3">
        <a href="/" class="btn btn-light">Back to Dashboard</a>
    </div>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>SSID</th>
                <th>Access Points</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            {% for item in results %}
            <tr>
                <td>{{ item.ssid }}</td>
                <td>{{ item.count }}</td>
                <td class="text-danger">{{ item.status }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center text-success">
                    ✅ No Evil Twin detected
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>
